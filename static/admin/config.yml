backend:
  name: turbo-github
  turbo_site_id: edbf184d-ea6b-4ad9-9bab-747d3bedca41
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "Category"
        name: "category"
        widget: "string"
        required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Article font"
        name: "article_font"
        widget: "select"
        default: "serif"
        options:
          - { label: "Editorial serif", value: "serif" }
          - { label: "Clean sans serif", value: "sans" }
        hint: "Choose the typeface for this article's body text."

      - label: "Article text size"
        name: "article_size"
        widget: "select"
        default: "comfortable"
        options:
          - { label: "Compact", value: "compact" }
          - { label: "Comfortable", value: "comfortable" }
          - { label: "Large", value: "large" }
        hint: "Choose a readable body text size for this article."

      - label: "Article"
        name: "body"
        widget: "richtext"
        modes: ["rich_text", "raw"]
        buttons:
          - bold
          - italic
          - strikethrough
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
        hint: "Format headings, links, quotes, and lists. Insert images or code blocks from the editor toolbar."
